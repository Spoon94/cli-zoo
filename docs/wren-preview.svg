  <text x="24" y="212" fill="#6272a4" font-size="11">Qoder CLI</text>
  <text x="24" y="236" xml:space="preserve"><tspan fill="#6272a4">~/Code/cli-zoo | </tspan><tspan fill="#bd93f9">feat/x</tspan><tspan fill="#f8f8f2"> ↑0↓0</tspan><tspan fill="#6272a4"> | wW:t1:p2 | qc</tspan><tspan fill="#6272a4"> · </tspan><tspan fill="#f8f8f2">16m</tspan></text>
  <text x="24" y="258" xml:space="preserve"><tspan fill="#f8f8f2">↑4.5M ↓65K | R4.2M </tspan><tspan fill="#8be9fd">CH98.21%</tspan><tspan fill="#6272a4"> | </tspan><tspan fill="#50fa7b">15.00%/1M</tspan><tspan fill="#f8f8f2"> TTFT 4.2s</tspan><tspan fill="#6272a4"> | </tspan><tspan fill="#ff79c6">Qwen3.8-Max</tspan><tspan fill="#f8f8f2"> · </tspan><tspan fill="#8be9fd">xhigh</tspan></text>

