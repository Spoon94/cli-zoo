  <circle cx="50" cy="16" r="5" fill="#50fa7b" opacity="0.85"/>

  <!-- CC 侧（行首标签在 SVG 外用文本注释代替） -->
  <text x="24" y="46" fill="#6272a4" font-size="11">Claude Code</text>
  <text x="24" y="70" xml:space="preserve"><tspan fill="#6272a4">~/Code/cli-zoo | </tspan><tspan fill="#bd93f9">main</tspan><tspan fill="#f8f8f2"> ↑0↓0 </tspan><tspan fill="#50fa7b">+5</tspan><tspan fill="#f8f8f2"> </tspan><tspan fill="#f1fa8c">✱4</tspan><tspan fill="#6272a4"> | wC:t1:p1 | cc</tspan><tspan fill="#6272a4"> · </tspan><tspan fill="#f8f8f2">1h5m</tspan></text>
