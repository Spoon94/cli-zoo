  <text x="24" y="300" fill="#6272a4" font-size="11">opencode（prompt 框内）</text>
  <text x="24" y="324" xml:space="preserve"><tspan fill="#6272a4">┃ Build · claude-opus-5 · max  </tspan><tspan fill="#bd93f9">main</tspan><tspan fill="#f8f8f2"> ↑0↓0 </tspan><tspan fill="#50fa7b">+3</tspan><tspan fill="#6272a4"> | wC:t1:p1 | oc</tspan><tspan fill="#6272a4"> · </tspan><tspan fill="#f8f8f2">15m</tspan></text>
  <text x="24" y="346" xml:space="preserve"><tspan fill="#6272a4">┃                       </tspan><tspan fill="#f8f8f2">↑17K ↓7 | R20K </tspan><tspan fill="#8be9fd">CH54.46%</tspan><tspan fill="#6272a4"> | </tspan><tspan fill="#50fa7b">7.19%/262K</tspan><tspan fill="#f8f8f2"> TTFT 4.3s</tspan></text>
