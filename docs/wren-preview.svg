<svg xmlns="http://www.w3.org/2000/svg" width="920" height="358" viewBox="0 0 920 358" font-family="Menlo, Monaco, 'SF Mono', Consolas, monospace" font-size="14">
  <!-- wren statusline 预览（Dracula 主题，深底）
