  <text x="24" y="124" fill="#6272a4" font-size="11">pi</text>
  <text x="24" y="148" xml:space="preserve"><tspan fill="#6272a4">~/Code/cli-zoo | </tspan><tspan fill="#bd93f9">main</tspan><tspan fill="#f8f8f2"> ↑0↓0 </tspan><tspan fill="#50fa7b">+5</tspan><tspan fill="#f8f8f2"> </tspan><tspan fill="#f1fa8c">✱4</tspan><tspan fill="#6272a4"> | wC:t1:p4 | pi</tspan><tspan fill="#6272a4"> · </tspan><tspan fill="#f8f8f2">46m</tspan></text>
  <text x="24" y="170" xml:space="preserve"><tspan fill="#f8f8f2">↑743K ↓117K | R19.6M </tspan><tspan fill="#8be9fd">CH99.31%</tspan><tspan fill="#6272a4"> | </tspan><tspan fill="#50fa7b">28.42%/1M</tspan><tspan fill="#f8f8f2"> TTFT 4.2s</tspan><tspan fill="#6272a4"> | </tspan><tspan fill="#ff79c6">claude-opus-5</tspan><tspan fill="#f8f8f2"> · </tspan><tspan fill="#8be9fd">high</tspan></text>

  <!-- 分隔线 2 -->
  <line x1="24" y1="192" x2="896" y2="192" stroke="#44475a" stroke-width="1"/>

